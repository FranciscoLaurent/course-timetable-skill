<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课表</title>
<style>
  :root{
    --line:#d8dee7; --line2:#aab6c6; --ink:#1e2633; --soft:#5c6878; --mute:#9aa5b4;
    --accent:#1f4ed8; --bg:#eef1f6; --card:#fff; --weekend:#f7f9fc; --empty:#eef1f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); padding:22px 14px 40px;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Songti SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto}

  /* ── 顶部 ── */
  .head{
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;box-shadow:0 1px 3px rgba(20,30,50,.05);
  }
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  .ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{
    font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line2);background:#fff;color:var(--ink);transition:.15s;
  }
  .btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.38;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--soft)}
  select{
    font:inherit;font-size:16px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;
    border:1.5px solid var(--accent);background:#fff;color:var(--accent);min-width:132px;
  }
  select:focus{outline:2px solid rgba(31,78,216,.28);outline-offset:1px}

  /* ── 状态条 ── */
  .bar{display:flex;align-items:center;gap:12px;margin:14px 2px 12px;flex-wrap:wrap}
  .stat{font-size:13.5px;color:var(--soft)}

  /* ── 表格 ── */
  table{
    width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
    border:1px solid var(--line2);border-radius:12px;overflow:hidden;
    box-shadow:0 1px 3px rgba(20,30,50,.05);table-layout:fixed;
  }
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  th:last-child,td:last-child{border-right:0}
  tbody tr:last-child td{border-bottom:0}

  thead th{
    background:#f2f5fa;font-size:14px;font-weight:600;padding:11px 6px;
    color:#33415a;white-space:nowrap;
  }
  thead th.weekend{background:#eaeff8;color:#3b4a66}
  thead th.corner{width:74px;font-weight:500;color:var(--soft);font-size:13px}

  tbody th{
    width:74px;background:#f7f9fc;font-size:14px;font-weight:600;color:#3d4b62;
    padding:8px 4px;white-space:nowrap;text-align:center;
  }

  td{vertical-align:top;padding:0;height:96px}
  td.weekend{background:var(--weekend)}
  td.blank{background:var(--empty);background-image:linear-gradient(135deg,transparent 47%,#e2e7ef 47%,#e2e7ef 53%,transparent 53%);}

  .course{padding:9px 10px;height:100%;border-left:4px solid transparent;display:flex;flex-direction:column;gap:4px}
  .course + .course{border-top:1px dashed var(--line)}
  .cname{font-size:14.5px;font-weight:600;line-height:1.38;color:#182234;word-break:break-word}
  .croom{font-size:12.5px;color:var(--soft);line-height:1.35}
  .croom b{font-weight:500;color:var(--mute);margin-right:3px}
  .cweeks{font-size:11.5px;color:var(--mute)}

  /* ── 空周 ── */
  .none{
    background:var(--card);border:1px dashed var(--line2);border-radius:12px;
    padding:46px 20px;text-align:center;color:var(--soft);font-size:15px;
  }
  .none b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}

  /* ── 页脚 ── */
  .foot{margin:16px 2px 0;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* ── 视图切换按钮 ── */
  .bar{justify-content:space-between}
  .barInfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .barHint{display:none;font-size:12.5px;color:var(--mute);white-space:nowrap}
  .barActions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn.sm{padding:5px 12px;font-size:12.5px;border-radius:7px}

  .scopeToggle{display:inline-flex;border:1px solid rgba(31,78,216,.34);border-radius:8px;overflow:hidden;background:#fff}
  .scopeToggle button{
    font:inherit;font-size:12.5px;padding:5px 12px;border:0;background:transparent;
    color:var(--soft);cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .scopeToggle button + button{border-left:1px solid rgba(31,78,216,.24)}
  .scopeToggle button:hover{color:var(--accent)}
  .scopeToggle button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}

  /* ── 学期总览：格子里会堆多门课，行高交给内容撑开 ── */
  body.mode-overview td{height:auto;min-height:92px}
  body.mode-overview .course + .course{margin-top:0;border-top:1px dashed #cdd6e3}
  body.mode-overview .ctrl{display:none}
  body.mode-overview .pNav{display:none}
  body.mode-overview .none b{font-size:17px}

  /* ── 轻提示（导出 PDF 时告诉用户选「另存为 PDF」） ── */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:99;max-width:min(92vw,520px);
    background:rgba(22,30,45,.94);color:#fff;
    font-size:13.5px;line-height:1.5;text-align:center;
    padding:10px 18px;border-radius:10px;
    box-shadow:0 10px 30px -8px rgba(0,0,0,.45);
    animation:toastIn .18s ease-out;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .viewToggle{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#fff}
  .viewToggle button{
    font:inherit;font-size:13px;padding:6px 14px;border:0;background:transparent;
    color:var(--soft);cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .viewToggle button + button{border-left:1px solid var(--line2)}
  .viewToggle button:hover{color:var(--accent)}
  .viewToggle button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}

  /* ── 表格容器：窄屏下允许横向滚动，而不是撑破布局 ── */
  .tblWrap{overflow:visible}
  @media (max-width:860px){
    .tblWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tblWrap table{min-width:680px}
  }

  /* ══════════════════════════════════════════════════════
     手机版：把课表装进一个手机外观里
     （机身 + 灵动岛 + 状态栏 + App 导航栏；背景是超大「课」「表」两字）
     宽表格在手机上一行放不下，所以手机里改成按天纵向卡片
     只在 body.view-mobile 下生效
     ══════════════════════════════════════════════════════ */
  .phoneWrap,.stageInk{display:none}

  /* ── 舞台背景：蓝白学术风（浅蓝渐变 + 极淡坐标格 + 超大天地字） ── */
  body.view-mobile{
    height:100vh;height:100dvh;overflow:hidden;
    padding:0;display:flex;flex-direction:column;
    background:
      radial-gradient(118% 86% at 10% 0%,  #e2ecff 0%, rgba(226,236,255,0) 58%),
      radial-gradient(112% 82% at 94% 100%, #e2f0fb 0%, rgba(226,240,251,0) 56%),
      linear-gradient(168deg, #fbfdff 0%, #f0f5fc 52%, #e7eef9 100%);
  }
  /* 极淡坐标格，像方格纸；四周用遮罩淡出 */
  body.view-mobile::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(31,78,216,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31,78,216,.055) 1px, transparent 1px);
    background-size:36px 36px;
    -webkit-mask-image:radial-gradient(132% 106% at 50% 42%, #000 24%, transparent 88%);
    mask-image:radial-gradient(132% 106% at 50% 42%, #000 24%, transparent 88%);
  }
  body.view-mobile .stageInk{display:block}
  .stageInk{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .stageInk span{
    position:absolute;user-select:none;
    font-family:"Songti SC","STSong","SimSun","Source Han Serif SC",serif;
    font-weight:900;line-height:.78;
    color:rgba(31,78,216,.075);
  }
  .stageInk .ink1{top:-5vmin;left:-2vmin;font-size:44vmin}
  .stageInk .ink2{bottom:-9vmin;right:-2vmin;font-size:48vmin;color:rgba(31,78,216,.055)}

  /* 顶栏只留一条细带（不占多少高度，好让机身长到 844），页脚在手机版隐藏 */
  body.view-mobile .wrap{
    max-width:none;margin:0;padding:0;
    flex:1;min-height:0;display:flex;flex-direction:column;
    position:relative;z-index:2;
  }
  body.view-mobile .head,
  body.view-mobile .tblWrap,
  body.view-mobile .foot,
  body.view-mobile .none{display:none}
  body.view-mobile .bar{
    flex:0 0 auto;margin:0;padding:8px 14px;
    align-items:center;justify-content:space-between;
    background:rgba(255,255,255,.66);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    border-bottom:1px solid rgba(31,78,216,.12);
  }
  body.view-mobile .stat{color:var(--soft);font-size:12.5px}
  body.view-mobile .barHint{display:inline}
  body.view-mobile .viewToggle button{padding:5px 12px;font-size:12.5px}
  /* 中等宽度下顶栏放不下三样，让位给"切换周次"提示，避免换行把机身压短 */
  @media (min-width:561px) and (max-width:820px){
    body.view-mobile .stat{display:none}
  }
  body.view-mobile .viewToggle{background:#fff;border-color:rgba(31,78,216,.28)}
  body.view-mobile .viewToggle button{color:var(--soft)}
  body.view-mobile .viewToggle button + button{border-left-color:rgba(31,78,216,.2)}
  body.view-mobile .viewToggle button:hover{color:var(--accent)}
  body.view-mobile .viewToggle button[aria-pressed="true"]{background:var(--accent);color:#fff}
  body.view-mobile .phoneWrap{
    /* 竖排 + padding：
       ① 竖排后机身的高度落在"主轴"上，容器装不下时由 flex-shrink 自动压短
          （原先横排时高度在交叉轴，只能靠 max-height:100% —— 而百分比高度对
            "由 flex 撑出来的不确定高度"解析失败，机身永远 844px，直接溢出被裁）
       ② padding 给机身外框留空间：机身外框是 box-shadow 0 0 0 11px/12px 画出来的，
          画在盒子外面，不留白就会被视口底边裁掉 */
    display:flex;flex-direction:column;
    flex:1 1 auto;min-height:0;
    align-items:center;justify-content:center;padding:16px;
  }

  /* ── 机身：宽 390、基准高 844；放不下时被压短，而不是溢出被裁 ── */
  .phone{
    position:relative;isolation:isolate;
    width:390px;height:844px;
    flex:0 1 844px;min-height:0;   /* 可缩不可长 */
    display:flex;flex-direction:column;
    background:#fff;border-radius:46px;overflow:hidden;
    box-shadow:
      0 0 0 11px #0a0a0a,
      0 0 0 12px #2a2a2a,
      0 40px 90px -20px rgba(0,0,0,.75),
      0 12px 40px -10px rgba(0,0,0,.55);
  }
  .phoneNotch{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:108px;height:28px;background:#0a0a0a;border-radius:20px;z-index:9;
  }

  /* ── 状态栏 ── */
  .pStatus{
    flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;
    padding:0 28px 0 30px;font-size:14px;font-weight:600;color:#1e2633;
  }
  .pTime{font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .pIcons{display:flex;align-items:center;gap:6px}
  .pIcons i{display:block;background:#1e2633}
  .pIcons .sg{width:17px;height:11px;
    clip-path:polygon(0 100%,0 70%,25% 70%,25% 55%,50% 55%,50% 35%,75% 35%,75% 15%,100% 15%,100% 100%)}
  .pIcons .wf{width:16px;height:11px;
    clip-path:polygon(0 100%,50% 18%,100% 100%,82% 100%,50% 52%,18% 100%)}
  .pIcons .bt{width:24px;height:11px;border:1.4px solid #1e2633;border-radius:3px;
    background:linear-gradient(to right,#1e2633 0 78%,transparent 78%);position:relative}
  .pIcons .bt::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;
    background:#1e2633;border-radius:0 1px 1px 0}

  /* ── App 主体 ── */
  .pApp{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
  .pBar{flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px 11px}
  .pTitle{font-size:15px;font-weight:600;text-align:center;color:var(--ink);margin:0 0 9px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pNav{display:flex;gap:7px;align-items:center}
  .pBtn{
    font:inherit;font-size:18px;line-height:1;width:38px;height:34px;flex:0 0 auto;
    border:1px solid var(--line2);background:#fff;border-radius:9px;color:var(--ink);cursor:pointer;
  }
  .pBtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .pBtn:disabled{opacity:.35;cursor:not-allowed}
  .pSel{
    flex:1 1 auto;font:inherit;font-size:14px;font-weight:600;padding:7px 8px;border-radius:9px;
    border:1.5px solid var(--accent);background:#fff;color:var(--accent);min-width:0;
  }
  .pScroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:11px 11px 16px}

  /* ── 卡片（手机内更紧凑） ── */
  .mday{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
  .mday > h3{
    margin:0;padding:8px 12px;background:#f2f5fa;font-size:13.5px;font-weight:600;color:#33415a;
    display:flex;justify-content:space-between;align-items:center;
  }
  .mday.weekend > h3{background:#eaeff8;color:#3b4a66}
  .mcount{font-size:11.5px;font-weight:500;color:var(--mute)}
  .mrow{display:flex;gap:9px;padding:10px 12px;border-top:1px solid var(--line);border-left:4px solid transparent}
  .mday > h3 + .mrow{border-top:0}
  .mper{flex:0 0 42px;font-size:12px;font-weight:600;color:var(--soft);padding-top:2px;white-space:nowrap}
  .mbody{flex:1;min-width:0}
  .mname{font-size:14.5px;font-weight:600;line-height:1.35;word-break:break-word}
  .mmeta{font-size:12px;color:var(--soft);margin-top:3px;line-height:1.45}
  .mempty{padding:11px 12px;margin:0;color:var(--mute);font-size:12.5px}

  /* 手机内"本周无课"空状态 */
  .pEmpty{padding:64px 20px;text-align:center;color:var(--soft);font-size:13.5px}
  .pEmpty b{display:block;font-size:16px;color:var(--ink);margin-bottom:8px}
  .pEmpty span{color:var(--mute);font-size:12.5px}

  /* ── 真的在手机上打开时：去掉机身和舞台，铺满屏幕（免得"手机里套手机"） ── */
  @media (max-width:560px){
    body.view-mobile{
      height:auto;min-height:100vh;overflow:visible;padding:0 0 14px;
      background:var(--bg);display:block;
    }
    body.view-mobile::before{display:none}
    body.view-mobile .stageInk{display:none!important}
    body.view-mobile .wrap{display:block;padding:0}
    body.view-mobile .bar{
      margin:0;padding:9px 12px;background:#fff;
      border-bottom:1px solid var(--line);
      position:sticky;top:0;z-index:20;
      -webkit-backdrop-filter:none;backdrop-filter:none;
      /* 真机上这一行塞不下"统计 + 提示 + 6 个按钮"：原来按钮组会被挤到右边裁掉。
         改成两行居中——统计一行、按钮一行，按钮放不下再往下换行。 */
      flex-wrap:wrap;gap:6px 8px;justify-content:center;
    }
    body.view-mobile .barInfo{flex:1 1 100%;justify-content:center}
    body.view-mobile .barActions{flex:1 1 100%;justify-content:center;flex-wrap:wrap;gap:6px}
    /* 触屏没有键盘，这条提示纯占地方（放不下时就是它把按钮挤出去的） */
    body.view-mobile .barHint{display:none}
    body.view-mobile .viewToggle button,
    body.view-mobile .btn.sm{padding:5px 10px;font-size:12.5px}
    body.view-mobile .foot{display:flex;margin:12px 12px 0;color:var(--mute)}
    .phoneWrap{display:block!important;padding:0;height:auto}
    .phone{
      width:100%;height:auto;max-height:none;min-height:calc(100vh - 108px);
      border-radius:0;box-shadow:none;
    }
    .phoneNotch,.pStatus{display:none}
    .pScroll{overflow:visible}
  }

  /* ── 手机版打印用图（平时不显示） ── */
  .printWrap{display:none}
  .printWrap img{display:block;width:100%;height:auto;margin:0}

  /* ── 打印 ── */
  /* 默认 A4 横版（电脑版打印表格用）。手机版的页面尺寸由 JS 在导出前按内容改写，
     见 <style id="pageStyle"> 与 setPrintPage()。 */
  @page{size:A4 landscape;margin:10mm}
  @media print{
    body{background:#fff;padding:0;font-size:12px}
    .head{box-shadow:none;border:0;padding:0 0 10px;border-radius:0}
    .ctrl,.viewToggle,.btn.sm,.foot .hint,.barHint,.toast{display:none!important}
    .bar{margin:6px 0 8px}
    .tblWrap{overflow:visible!important}
    .tblWrap table{min-width:0!important}
    table{box-shadow:none;border-radius:0;border:1.5px solid #000}
    th,td{border-color:#000!important}
    thead th{background:#fff!important;color:#000!important}
    tbody th{background:#fff!important}
    td.weekend{background:#fff}
    td.blank{background:#fff!important;background-image:none!important}
    .course{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .none{border:0}
    .foot{margin-top:8px}

    /* ══ 手机版打印，分两种情况 ══ */
    body.view-mobile{
      background:#fff!important;height:auto!important;min-height:0!important;
      overflow:visible!important;display:block!important;
      padding:0!important;margin:0!important;color:#000;
    }
    body.view-mobile::before{display:none!important}
    .stageInk{display:none!important}

    /* ── 按周 + 手机版：印与纸型【同尺寸】的那张图，保证一页装下 ──
       （不印 HTML 卡片 —— HTML 行高/内边距与图片不一致，会长出纸张导致翻页） */
    body.view-mobile:not(.mode-overview) .head,
    body.view-mobile:not(.mode-overview) .tblWrap,
    body.view-mobile:not(.mode-overview) .bar,
    body.view-mobile:not(.mode-overview) .foot,
    body.view-mobile:not(.mode-overview) .none,
    body.view-mobile:not(.mode-overview) .phoneWrap{display:none!important}
    body.view-mobile:not(.mode-overview) .wrap{
      display:block!important;padding:0!important;margin:0!important;
      position:static!important;height:auto!important;max-width:none!important;
    }
    body.view-mobile:not(.mode-overview) .printWrap{display:block!important;margin:0!important;padding:0!important}
    body.view-mobile:not(.mode-overview) .printWrap img{
      display:block!important;width:100%!important;height:auto!important;margin:0!important;
    }

    /* ── 学期总览 + 手机版：印 HTML 卡片，浏览器自然分页（卡片不跨页断开） ── */
    body.view-mobile.mode-overview .printWrap{display:none!important}
    body.view-mobile.mode-overview .head,
    body.view-mobile.mode-overview .tblWrap,
    body.view-mobile.mode-overview .bar,
    body.view-mobile.mode-overview .foot,
    body.view-mobile.mode-overview .none{display:none!important}
    body.view-mobile.mode-overview .wrap{
      display:block!important;padding:0!important;margin:0!important;
      position:static!important;height:auto!important;max-width:none!important;
    }
    body.view-mobile.mode-overview .phoneWrap{
      display:block!important;height:auto!important;padding:0!important;min-height:0!important;
    }
    body.view-mobile.mode-overview .phone{
      width:auto!important;height:auto!important;max-height:none!important;min-height:0!important;
      border-radius:0!important;box-shadow:none!important;overflow:visible!important;background:#fff!important;
    }
    body.view-mobile.mode-overview .phoneNotch,
    body.view-mobile.mode-overview .pStatus,
    body.view-mobile.mode-overview .pNav{display:none!important}
    body.view-mobile.mode-overview .pApp{display:block!important;background:#fff!important}
    body.view-mobile.mode-overview .pBar{

<script>
/* ============================================================
   数据由 scripts/build_timetable.py 从 spec.json 注入，请勿手改。
   courses 每项: {day, block, name, room, weeks:[[起,止],…], weeksText}
   ============================================================ */
const DATA = __DATA__;

const DAYS   = DATA.days;
const BLOCKS = DATA.blocks;

/* 课程配色：按课程名首次出现顺序分配 */
const PALETTE = ['#1f4ed8','#0f8a6a','#b45309','#9333ea','#be123c','#0369a1','#4d7c0f','#7c3aed'];
const COLOR = {};
DATA.courses.forEach(function(c){
  if (!(c.name in COLOR)) COLOR[c.name] = PALETTE[Object.keys(COLOR).length % PALETTE.length];
});

/* ---------- 纯逻辑（可在 Node 中独立测试） ---------- */
function inWeeks(ranges, w){
  for (var i=0;i<ranges.length;i++){ if (w >= ranges[i][0] && w <= ranges[i][1]) return true; }
  return false;
}

/** 返回 { 周次: { 星期名: { 节次: [课程…] } } } */
function buildWeekMap(){
  var map = {};
  for (var w = 1; w <= DATA.maxWeek; w++){
    var day = {};
    for (var i=0;i<DATA.courses.length;i++){
      var c = DATA.courses[i];
      if (!inWeeks(c.weeks, w)) continue;
      if (!day[c.day]) day[c.day] = {};
      if (!day[c.day][c.block]) day[c.day][c.block] = [];
      day[c.day][c.block].push(c);
    }
    map[w] = day;
  }
  return map;
}

function weekStats(dayMap){
  var n = 0, slots = 0;
  for (var d in dayMap){ for (var b in dayMap[d]){ slots++; n += dayMap[d][b].length; } }
  return { count:n, slots:slots };
}

function weekTitle(w){
  return (DATA.who ? DATA.who : '') + '第' + w + '周课表';
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g, function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];
  });
}

/** 教室 / 教师 拼成一行（纯文本，供导出图片用） */
function courseMetaText(c){
  var parts = [];
  if (c.room)    parts.push('教室 ' + c.room);
  if (c.teacher) parts.push('教师 ' + c.teacher);
  return parts.join(' · ');
}

/** 同上，HTML 版（两个都没有就返回空串，那一行自动省略） */
function courseMeta(c){
  var t = courseMetaText(c);
  return t ? esc(t) : '';
}

/* ============================================================
   导出图片：纯 SVG → Canvas，不依赖任何外部库，离线可用
   ============================================================ */
var SVG_FONT = "'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Source Han Sans SC',sans-serif";

function svgText(x, y, str, opt){
  opt = opt || {};
  return '<text x="' + x + '" y="' + y + '"'
       + ' font-family="' + SVG_FONT + '"'
       + ' font-size="' + (opt.size || 13) + '"'
       + (opt.weight ? ' font-weight="' + opt.weight + '"' : '')
       + ' fill="' + (opt.fill || '#1e2633') + '"'
       + (opt.anchor ? ' text-anchor="' + opt.anchor + '"' : '')
       + '>' + esc(str) + '</text>';
}

/** 折行：全角算 1 个单位、半角算 0.55；超过 maxLines 就截断加省略号 */
function wrapLines(str, maxUnits, maxLines){
  var all = [], line = '', w = 0;
  String(str == null ? '' : str).split('\n').forEach(function(seg){
    for (var i = 0; i < seg.length; i++){
      var ch = seg.charAt(i);
      var u = /[\x00-\xff]/.test(ch) ? 0.55 : 1;
      if (w + u > maxUnits && line){ all.push(line); line = ''; w = 0; }
      line += ch; w += u;
    }
    if (line){ all.push(line); line = ''; w = 0; }
  });
  if (all.length > maxLines){
    all = all.slice(0, maxLines);
    all[maxLines - 1] = all[maxLines - 1].slice(0, -1) + '…';
  }
  return all.length ? all : [''];
}

/** 电脑版：横版表格图（title 由调用方给，按周 / 总览都能用） */
function buildTableSVG(title, dayMap, days){
  var PAD = 22, BW = 64, HH = 38, GAP = 8, RH_MIN = 88, SIZE_W = 13, SIZE_M = 11.5;
  var CW = days.length > 5 ? 150 : 190;
  var tw = function(s, size){ return (CW - 22) / size * 1.05; };

  var rows = BLOCKS.map(function(blk){
    var cells = days.map(function(d){ return (dayMap[d] && dayMap[d][blk]) || []; });
    var h = RH_MIN;
    cells.forEach(function(items){
      var need = 10;
      items.forEach(function(c, k){
        if (k) need += 10;
        need += 17 * wrapLines(c.name, tw(c.name, SIZE_W), 2).length;
        var meta = courseMetaText(c);
        if (meta) need += 15 * wrapLines(meta, tw(meta, SIZE_M), 2).length;
        if (c.weeksLabel) need += 14;
      });
      h = Math.max(h, need + 16);
    });
    return { blk: blk, cells: cells, h: h };
  });

  var TITLE_H = 52, headW = BW + days.length * CW;
  var width = PAD * 2 + headW;
  var height = TITLE_H + HH + rows.reduce(function(a, r){ return a + r.h; }, 0) + PAD;

  var s = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 ' + width + ' ' + height + '">'];
  s.push('<rect width="' + width + '" height="' + height + '" fill="#ffffff"/>');
  s.push(svgText(PAD, 34, title, { size: 22, weight: 700, fill: '#16202e' }));

  var hy = TITLE_H;
  s.push('<rect x="' + PAD + '" y="' + hy + '" width="' + headW + '" height="' + HH + '" fill="#f2f5fa"/>');
  s.push(svgText(PAD + BW / 2, hy + 24, '节次', { size: 13, fill: '#5c6878', anchor: 'middle' }));
  days.forEach(function(d, i){
    s.push(svgText(PAD + BW + i * CW + CW / 2, hy + 24, d, { size: 14, weight: 600, fill: '#33415a', anchor: 'middle' }));
  });

  var y = hy + HH;
  rows.forEach(function(row, ri){
    if (ri % 2 === 1) s.push('<rect x="' + PAD + '" y="' + y + '" width="' + headW + '" height="' + row.h + '" fill="#fbfcfe"/>');
    s.push(svgText(PAD + BW / 2, y + row.h / 2 + 5, row.blk, { size: 14, weight: 600, fill: '#3d4b62', anchor: 'middle' }));
    row.cells.forEach(function(items, di){
      var x = PAD + BW + di * CW;
      items.forEach(function(c, k){
        var cy = y + 10 + (k ? 10 : 0);
        items.slice(0, k).forEach(function(pc){
          cy += 17 * wrapLines(pc.name, tw(pc.name, SIZE_W), 2).length;
          var pm = courseMetaText(pc);
          if (pm) cy += 15 * wrapLines(pm, tw(pm, SIZE_M), 2).length;
          if (pc.weeksLabel) cy += 14;
        });
        var col = COLOR[c.name] || '#1f4ed8';
        s.push('<rect x="' + x + '" y="' + cy + '" width="3" height="14" rx="1.5" fill="' + col + '"/>');
        wrapLines(c.name, tw(c.name, SIZE_W), 2).forEach(function(ln, li){
          s.push(svgText(x + 9, cy + 12 + li * 17, ln, { size: SIZE_W, weight: 600, fill: col }));
        });
        var used = 17 * wrapLines(c.name, tw(c.name, SIZE_W), 2).length;
        var meta = courseMetaText(c);
        if (meta){
          wrapLines(meta, tw(meta, SIZE_M), 2).forEach(function(ln, li){
            s.push(svgText(x + 9, cy + 12 + used + li * 15, ln, { size: SIZE_M, fill: '#5c6878' }));
          });
          used += 15 * wrapLines(meta, tw(meta, SIZE_M), 2).length;
        }
        if (c.weeksLabel) s.push(svgText(x + 9, cy + 14 + used, c.weeksLabel, { size: 10.5, fill: '#9aa5b4' }));
      });
    });
    y += row.h;
  });

  s.push('<rect x="' + PAD + '" y="' + hy + '" width="' + headW + '" height="' + (y - hy) + '" fill="none" stroke="#c3cdda"/>');
  for (var i = 1; i <= days.length; i++)
    s.push('<line x1="' + (PAD + BW + (i - 1) * CW) + '" y1="' + hy + '" x2="' + (PAD + BW + (i - 1) * CW) + '" y2="' + y + '" stroke="#dde3ec"/>');
  var ly = hy + HH;
  s.push('<line x1="' + PAD + '" y1="' + ly + '" x2="' + (PAD + headW) + '" y2="' + ly + '" stroke="#c3cdda" stroke-width="1"/>');
  rows.forEach(function(row){ ly += row.h; s.push('<line x1="' + PAD + '" y1="' + ly + '" x2="' + (PAD + headW) + '" y2="' + ly + '" stroke="#dde3ec"/>'); });

  s.push('</svg>');
  return s.join('');
}

/** 手机版：竖版卡片图 */
function buildCardsSVG(title, dayMap, days){
  var PAD = 16, W = 420, CARD_HEAD = 32, ROW_H = 46, GAP = 10, TITLE_H = 54;
  var per = days.map(function(d){
    var items = [];
    BLOCKS.forEach(function(blk){
      ((dayMap[d] && dayMap[d][blk]) || []).forEach(function(c){ items.push({ per: blk, c: c }); });
    });
    return { day: d, items: items };
  });
  var height = TITLE_H + PAD;
  per.forEach(function(p){ height += CARD_HEAD + Math.max(1, p.items.length) * ROW_H + GAP; });

  var s = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + height + '" viewBox="0 0 ' + W + ' ' + height + '">'];
  s.push('<rect width="' + W + '" height="' + height + '" fill="#ffffff"/>');
  s.push(svgText(W / 2, 34, title, { size: 20, weight: 700, fill: '#16202e', anchor: 'middle' }));

  var y = TITLE_H;
  per.forEach(function(p){
    var bodyH = Math.max(1, p.items.length) * ROW_H;
    var isWk = isWeekend(p.day);
    s.push('<rect x="' + PAD + '" y="' + y + '" width="' + (W - PAD * 2) + '" height="' + (CARD_HEAD + bodyH) + '" rx="11" fill="#ffffff" stroke="#d8dee7"/>');
    s.push('<path d="M' + (PAD + 11) + ' ' + y + ' h' + (W - PAD * 2 - 22) + ' a11 11 0 0 1 11 11 v' + (CARD_HEAD - 11) + ' h' + (-(W - PAD * 2)) + ' v' + (-(CARD_HEAD - 11)) + ' a11 11 0 0 1 11 -11 z" fill="' + (isWk ? '#eaeff8' : '#f2f5fa') + '"/>');
    s.push(svgText(PAD + 14, y + 21, p.day, { size: 14, weight: 600, fill: isWk ? '#3b4a66' : '#33415a' }));
    if (p.items.length)
      s.push(svgText(W - PAD - 14, y + 21, p.items.length + ' 节课', { size: 11.5, fill: '#9aa5b4', anchor: 'end' }));

    if (!p.items.length){
      s.push(svgText(PAD + 14, y + CARD_HEAD + 28, '无课', { size: 12.5, fill: '#9aa5b4' }));
    } else {
      p.items.forEach(function(it, i){
        var ry = y + CARD_HEAD + i * ROW_H;
        var col = COLOR[it.c.name] || '#1f4ed8';
        s.push('<line x1="' + PAD + '" y1="' + ry + '" x2="' + (W - PAD) + '" y2="' + ry + '" stroke="' + (i ? '#edf1f7' : '#d8dee7') + '"/>');
        s.push('<rect x="' + PAD + '" y="' + (ry + 9) + '" width="4" height="16" rx="2" fill="' + col + '"/>');
        s.push(svgText(PAD + 12, ry + 22, it.per, { size: 12, weight: 600, fill: '#5c6878' }));
        s.push(svgText(PAD + 60, ry + 20, wrapLines(it.c.name, 20, 1)[0], { size: 14.5, weight: 600, fill: col }));
        var meta = [courseMetaText(it.c), it.c.weeksLabel || it.c.weeksText || ''].filter(Boolean).join(' · ');
        if (meta) s.push(svgText(PAD + 60, ry + 37, wrapLines(meta, 30, 1)[0], { size: 11.5, fill: '#5c6878' }));
      });
    }
    y += CARD_HEAD + bodyH + GAP;
  });
  s.push('</svg>');
  return s.join('');
}

/* ---------- 轻提示 ---------- */
var toastTimer = null;
function toast(msg){
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.hidden = true; }, 5000);
}

/* ---------- 导出：PDF / 图片 ---------- */
/** 打印前按当前视图设定纸张尺寸。
    电脑版 = A4 横向（表格）；手机版 = 与「导出图片」手机版画布**同尺寸**的竖版页面。 */
function setPrintPage(){
  var el = document.getElementById('pageStyle');
  if (!el) return null;
  var sc = currentScopeData();
  if (resolveView() === 'mobile'){
    var m = /<svg[^>]*\bwidth="(\d+)"[^>]*\bheight="(\d+)"/.exec(buildCardsSVG(sc.title, sc.dayMap, visibleDays()));
    if (m){
      var mmW = (+m[1] * 25.4 / 96).toFixed(1);                    // CSS px → mm
      if (sc.isOverview){
        // 学期总览可能很长：宽度照手机，高度取 A4，允许自动分页
        el.textContent = '@page{size:' + mmW + 'mm 297mm;margin:0}';
        return { w: +m[1], h: +m[2], pages: Math.max(1, Math.ceil(+m[2] / (297 * 96 / 25.4))) };
      }
      var mmH = ((+m[2] * 25.4 / 96) + 1).toFixed(1);              // 高度多留 1mm，
      el.textContent = '@page{size:' + mmW + 'mm ' + mmH + 'mm;margin:0}';  // 免得四舍五入挤出第二页
      return { w: +m[1], h: +m[2], pages: 1 };
    }
  }
  el.textContent = '@page{size:A4 landscape;margin:10mm}';
  return { w: 0, h: 0, pages: 0 };
}

function exportPDF(){
  var sc = currentScopeData();
  var view = resolveView();
  var box = setPrintPage();
  var done = false;
  function go(){
    if (done) return;
    done = true;
    var msg;
    if (view !== 'mobile')          msg = '将导出为 A4 横版表格 PDF（内容多时自动分页）';
    else if (sc.isOverview)         msg = '将导出为手机版尺寸的学期总览 PDF（约 '
                                        + box.pages + ' 页，可超过一页）';
    else                            msg = '将导出为手机版尺寸（' + box.w + '×' + box.h + '，一页）的竖版 PDF';
    toast(msg + '；在打印对话框里把「目标打印机」选成「另存为 PDF」。');
    setTimeout(function(){ window.print(); }, 120);
  }
  /* 只有「按周 + 手机版」才印那张精确尺寸的图（保证一页）。
     学期总览改用 HTML 卡片，让浏览器自然分页，卡片不会被拦腰截断。 */
  if (view === 'mobile' && !sc.isOverview){
    var img = document.getElementById('printImg');
    if (img){
      img.onload = go;
      img.onerror = go;
      img.src = 'data:image/svg+xml;charset=utf-8,'
              + encodeURIComponent(buildCardsSVG(sc.title, sc.dayMap, visibleDays()));
      setTimeout(go, 900);   // 兜底：万一 onload 没触发
      return;
    }
  }
  go();
}

function saveBlob(href, filename){
  var a = document.createElement('a');
  a.href = href;
  a.download = filename;
  if (document.body && document.body.appendChild) document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    if (document.body && document.body.removeChild) { try { document.body.removeChild(a); } catch(e){} }
    try { URL.revokeObjectURL(href); } catch(e){}
  }, 2500);
}

function exportImage(){
  var sc = currentScopeData();
  var view = resolveView();
  var svg = (view === 'mobile')
      ? buildCardsSVG(sc.title, sc.dayMap, visibleDays())
      : buildTableSVG(sc.title, sc.dayMap, visibleDays());
  var m = /<svg[^>]*\bwidth="(\d+)"[^>]*\bheight="(\d+)"/.exec(svg);
  if (!m){ toast('图片生成失败，请改用「导出 PDF」。'); return; }
  var W = parseInt(m[1], 10), H = parseInt(m[2], 10), scale = 2;
  var filename = sc.title + (view === 'mobile' ? '_手机版' : '') + '.png';
  var img = new Image();
  img.onload = function(){
    var c = document.createElement('canvas');
    c.width = W * scale; c.height = H * scale;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    if (c.toBlob){
      c.toBlob(function(b){
        if (b) saveBlob(URL.createObjectURL(b), filename);
        else saveBlob(c.toDataURL('image/png'), filename);
      }, 'image/png');
    } else {
      saveBlob(c.toDataURL('image/png'), filename);
    }
    toast('已导出图片：' + filename);
  };
  img.onerror = function(){ toast('图片导出失败，请改用「导出 PDF」。'); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- 页面渲染 ---------- */
var WEEK_MAP = buildWeekMap();
var current  = null;

/* ---------- 范围：按周查看 / 学期总览 ---------- */
var SCOPE_KEY = 'course-timetable-scope';
var scope = 'week';                       // 'week' | 'overview'

/** 学期总览：每个 (星期, 节次) 格子里放该时段【出现过的全部课程】，按起始周排序。
    例：A 课 8-16 周周一 3-4、B 课 17-20 周周一 3-4 → 这一格里 A、B 上下叠放。 */
var OVERVIEW = (function buildOverview(){
  var map = {};
  DATA.courses.forEach(function(c){
    if (!map[c.day]) map[c.day] = {};
    if (!map[c.day][c.block]) map[c.day][c.block] = [];
    map[c.day][c.block].push(c);
  });
  Object.keys(map).forEach(function(d){
    Object.keys(map[d]).forEach(function(b){
      map[d][b].sort(function(x, y){ return x.weeks[0][0] - y.weeks[0][0]; });
    });
  });
  return map;
})();

function overviewTitle(){
  return (DATA.who || '') + '学期课表总览';
}

function resolveScope(){
  var q = /[?&]scope=(week|overview)/.exec(location.search);
  if (q) return q[1];
  try { var s = localStorage.getItem(SCOPE_KEY); if (s === 'week' || s === 'overview') return s; } catch(e){}
  return 'week';                          // 默认按周查看
}

function applyScope(){
  var a = document.getElementById('scopeWeek'), b = document.getElementById('scopeAll');
  if (a) a.setAttribute('aria-pressed', String(scope === 'week'));
  if (b) b.setAttribute('aria-pressed', String(scope === 'overview'));
  applyBodyClass();
}

function chooseScope(v){
  scope = (v === 'overview') ? 'overview' : 'week';
  try { localStorage.setItem(SCOPE_KEY, scope); } catch(e){}
  applyScope();
  renderScope();
}

/* ---------- 视图切换（电脑版 / 手机版） ---------- */
var VIEW_KEY = 'course-timetable-view';
var viewPref = null;            // null = 自动（按屏幕宽度判断）

function resolveView(){
  if (viewPref) return viewPref;
  var q = /[?&]view=(web|mobile)/.exec(location.search);
  if (q) return q[1];
  try {
    var s = localStorage.getItem(VIEW_KEY);
    if (s === 'web' || s === 'mobile') return s;
  } catch(e){}
  var w = (typeof window !== 'undefined' && window.innerWidth) ? window.innerWidth : 1200;
  return w < 780 ? 'mobile' : 'web';
}

/* body 上的 class：view-web / view-mobile ＋ mode-overview（总览时才有） */
function applyBodyClass(){
  if (document.body) {
    document.body.className = 'view-' + resolveView() + (scope === 'overview' ? ' mode-overview' : '');
  }
}

function applyView(v){
  if (document.body) document.body.className = 'view-' + v + (scope === 'overview' ? ' mode-overview' : '');
  var a = document.getElementById('viewWeb'), b = document.getElementById('viewMobile');
  if (a) a.setAttribute('aria-pressed', String(v === 'web'));
  if (b) b.setAttribute('aria-pressed', String(v === 'mobile'));
}

function chooseView(v){
  viewPref = v;
  try { localStorage.setItem(VIEW_KEY, v); } catch(e){}
  applyView(v);
}

/* 电脑版与手机版各有一套选周控件，必须始终同步 */
function syncWeekControls(w){
  var atStart = (w <= 1), atEnd = (w >= DATA.maxWeek);
  ['prev', 'pPrev'].forEach(function(id){
    var e = document.getElementById(id); if (e) e.disabled = atStart;
  });
  ['next', 'pNext'].forEach(function(id){
    var e = document.getElementById(id); if (e) e.disabled = atEnd;
  });
  ['weekSel', 'pWeek'].forEach(function(id){
    var e = document.getElementById(id); if (e) e.value = String(w);
  });
}

function fillWeekSelect(sel, compact){
  if (!sel) return;
  sel.innerHTML = '';
  for (var w = 1; w <= DATA.maxWeek; w++){
    var st = weekStats(WEEK_MAP[w] || {});
    var op = document.createElement('option');
    op.value = String(w);
    op.textContent = compact
        ? ('第 ' + w + ' 周' + (st.count ? ' · ' + st.count + ' 节' : ' · 无课'))
        : ('第 ' + w + ' 周' + (st.count ? '（' + st.count + ' 门次）' : ' · 无课'));
    sel.appendChild(op);
  }
}

function visibleDays(){
  if (!DATA.hideEmptyDays) return DAYS;
  var used = {};
  DATA.courses.forEach(function(c){ used[c.day] = true; });
  var keep = DAYS.filter(function(d){ return used[d]; });
  return keep.length ? keep : DAYS;
}

/* 是否周末：按星期名判断，不能按列序号 —— 各校一周的天数和顺序都不一样 */
function isWeekend(d){
  return d === '周六' || d === '周日' || d === '星期六' || d === '星期日' || d === '星期天'
      || /^(sat|sun)/i.test(d);
}

/** 手机版：按天纵向卡片，每张卡片列出当天的课（按节次顺序） */
function renderMobileView(dayMap, days){
  var html = '';
  for (var di=0; di<days.length; di++){
    var d = days[di], items = [];
    for (var bi=0; bi<BLOCKS.length; bi++){
      var arr = (dayMap[d] && dayMap[d][BLOCKS[bi]]) || [];
      for (var k=0;k<arr.length;k++) items.push({ per: BLOCKS[bi], c: arr[k] });
    }
    html += '<section class="mday' + (isWeekend(d) ? ' weekend' : '') + '">'
          +   '<h3>' + esc(d) + (items.length ? '<span class="mcount">' + items.length + ' 节课</span>' : '') + '</h3>';
    if (!items.length){
      html += '<p class="mempty">无课</p>';
    } else {
      for (var i=0;i<items.length;i++){
        var c = items[i].c, col = COLOR[c.name] || '#1f4ed8';
        var wk = c.weeksLabel || c.weeksText || '';
        var mm = [courseMeta(c), esc(wk)].filter(Boolean).join(' · ');
        html += '<div class="mrow" style="border-left-color:' + col + '">'
              +   '<span class="mper">' + esc(items[i].per) + '</span>'
              +   '<div class="mbody">'
              +     '<div class="mname" style="color:' + col + '">' + esc(c.name) + '</div>'
              +     (mm ? '<div class="mmeta">' + mm + '</div>' : '')
              +   '</div>'
              + '</div>';
      }
    }
    html += '</section>';
  }
  return html;
}

function renderScope(){
  var isOv = (scope === 'overview');
  var dayMap = isOv ? OVERVIEW : (WEEK_MAP[current] || {});
  var stats  = weekStats(dayMap);
  var t      = isOv ? overviewTitle() : weekTitle(current);
  var days   = visibleDays();

  document.getElementById('title').textContent = t;
  document.title = t;
  document.getElementById('stat').textContent = stats.count
      ? (isOv ? '全学期共 ' + stats.count + ' 门次课，占用 ' + stats.slots + ' 个时段'
              : '本周共 ' + stats.count + ' 门次课，占用 ' + stats.slots + ' 个时段')
      : (isOv ? '本学期还没有安排课程' : '本周没有安排课程');

  var tbody = document.getElementById('tbody');
  var none  = document.getElementById('none');
  var grid  = document.getElementById('grid');
  var mlist = document.getElementById('mlist');

  /* 同步全部选周控件（电脑版 + 手机版）与手机内标题。
     必须放在"空内容早退"之前，否则空周时下拉框/按钮会与页面不同步 */
  syncWeekControls(current || 1);
  var pTitle = document.getElementById('pTitle');
  if (pTitle) pTitle.textContent = t;
  var qs = '?view=' + resolveView() + '&scope=' + scope;
  if (!isOv) qs += '&week=' + current;
  try { history.replaceState(null, '', qs); } catch(e){}

  if (!stats.count){
    grid.hidden = true;
    tbody.innerHTML = '';
    if (mlist) mlist.innerHTML = '<div class="pEmpty"><b>' + esc(t) + '</b><span>'
        + (isOv ? '还没有安排任何课程' : '换一个周次看看') + '</span></div>';
    none.hidden = false;
    none.innerHTML = '<b>' + esc(t) + '</b>'
        + (isOv ? '本学期还没有安排课程。' : '这周的课表是空的，换一个周次看看。');
    return;
  }
  grid.hidden = false;
  none.hidden = true;
  if (mlist) mlist.innerHTML = renderMobileView(dayMap, days);

  var html = '';
  for (var bi=0; bi<BLOCKS.length; bi++){
    var blk = BLOCKS[bi];
    html += '<tr><th scope="row">' + blk + '</th>';
    for (var di=0; di<days.length; di++){
      var d = days[di];
      var items = (dayMap[d] && dayMap[d][blk]) || [];
      var cls = 'td' + (isWeekend(d) ? ' weekend' : '');
      if (!items.length){ html += '<td class="' + cls + ' blank"></td>'; continue; }
      html += '<td class="' + cls + '">';
      for (var k=0;k<items.length;k++){
        var c = items[k];
        var col = COLOR[c.name] || '#1f4ed8';
        html += '<div class="course" style="border-left-color:' + col + '">'
              +   '<div class="cname" style="color:' + col + '">' + esc(c.name) + '</div>'
              +   (courseMeta(c) ? '<div class="croom">' + courseMeta(c) + '</div>' : '')
              +   (c.weeksLabel ? '<div class="cweeks">' + esc(c.weeksLabel) + '</div>' : '')
              + '</div>';
      }
      html += '</td>';
    }
    html += '</tr>';
  }
  tbody.innerHTML = html;
}

function renderWeek(w){ current = w; renderScope(); }

/** 当前该渲染哪张表：{ dayMap, title, isOverview } */
function currentScopeData(){
  var isOv = (scope === 'overview');
  return {
    isOverview: isOv,
    dayMap: isOv ? OVERVIEW : (WEEK_MAP[current] || {}),
    title: isOv ? overviewTitle() : weekTitle(current)
  };
}

function init(){
  var d = DATA;
  /* 页脚只放学期。刻意不放时间戳，也不放任何院系、编制类标识：
     各校建制不一样，写进去外人看不懂，而且与"看某一周的课"无关。 */
  document.getElementById('source').textContent = d.term || '';

  var headRow = document.getElementById('headRow');
  var days = visibleDays();
  var hh = '<th class="corner">节次</th>';
  for (var i=0;i<days.length;i++) hh += '<th' + (isWeekend(days[i]) ? ' class="weekend"' : '') + '>' + esc(days[i]) + '</th>';
  headRow.innerHTML = hh;

  var sel = document.getElementById('weekSel');
  fillWeekSelect(sel, false);                                        // 电脑版：带门次
  fillWeekSelect(document.getElementById('pWeek'), true);            // 手机版：短标签

  sel.addEventListener('change', function(){ renderWeek(parseInt(this.value, 10)); });
  document.getElementById('prev').addEventListener('click', function(){ if (current>1) renderWeek(current-1); });
  document.getElementById('next').addEventListener('click', function(){ if (current<d.maxWeek) renderWeek(current+1); });
  /* 手机内导航 */
  document.getElementById('pWeek').addEventListener('change', function(){ renderWeek(parseInt(this.value, 10)); });
  document.getElementById('pPrev').addEventListener('click', function(){ if (current>1) renderWeek(current-1); });
  document.getElementById('pNext').addEventListener('click', function(){ if (current<d.maxWeek) renderWeek(current+1); });
  var pTime = document.getElementById('pTime');
  if (pTime){
    var now = new Date();
    pTime.textContent = now.getHours() + ':' + ('0' + now.getMinutes()).slice(-2);
  }
  document.getElementById('pdfBtn').addEventListener('click', exportPDF);
  document.getElementById('imgBtn').addEventListener('click', exportImage);
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft'  && current>1)         renderWeek(current-1);
    if (e.key === 'ArrowRight' && current<d.maxWeek) renderWeek(current+1);
  });

  /* 视图切换（电脑版 / 手机版） */
  document.getElementById('viewWeb').addEventListener('click', function(){ chooseView('web'); });
  document.getElementById('viewMobile').addEventListener('click', function(){ chooseView('mobile'); });
  /* 范围切换（按周查看 / 学期总览） */
  document.getElementById('scopeWeek').addEventListener('click', function(){ chooseScope('week'); });
  document.getElementById('scopeAll').addEventListener('click', function(){ chooseScope('overview'); });
  if (typeof window !== 'undefined' && window.addEventListener){
    window.addEventListener('resize', function(){ if (!viewPref) applyView(resolveView()); });
  }

  scope = resolveScope();
  applyView(resolveView());     // 内部会带上 mode-overview
  applyScope();
  if (scope !== 'overview'){
    var start = d.defaultWeek || 1;
    var q = /[?&]week=(\d+)/.exec(location.search);
    if (q){ var v = parseInt(q[1],10); if (v>=1 && v<=d.maxWeek) start = v; }
    current = start;
  }
  renderScope();
}

if (typeof document !== 'undefined') init();
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { DATA: DATA, buildWeekMap: buildWeekMap, weekStats: weekStats,
                     inWeeks: inWeeks, weekTitle: weekTitle, renderWeek: renderWeek,
                     resolveView: resolveView, applyView: applyView, chooseView: chooseView,
                     buildTableSVG: buildTableSVG, buildCardsSVG: buildCardsSVG,
                     wrapLines: wrapLines, courseMetaText: courseMetaText,
                     visibleDays: visibleDays, isWeekend: isWeekend, setPrintPage: setPrintPage,
                     renderScope: renderScope, chooseScope: chooseScope, resolveScope: resolveScope,
                     applyScope: applyScope, overviewTitle: overviewTitle };
}
</script>
